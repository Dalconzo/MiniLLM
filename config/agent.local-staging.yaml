app:
  name: local-agent-lab-local-staging
  log_level: info

paths:
  data_dir: data/local_staging
  logs_dir: data/local_staging/logs
  indexes_dir: data/local_staging/indexes
  memory_dir: data/local_staging/memory
  patches_dir: data/local_staging/patches

ollama:
  host: http://127.0.0.1:11434
  request_timeout_seconds: 180

runtime:
  default_task: chat
  redact_before_model: true
  save_full_prompts: true

models:
  code_default:
    model: qwen2.5-coder:7b
    task: code
    temperature: 0.2
    max_tokens: 1024
    routing_label: LOCAL_OK
    notes: Local staging code model. Must not imply production readiness.
  chat_default:
    model: llama3.2:3b
    task: chat
    temperature: 0.3
    max_tokens: 768
    routing_label: LOCAL_WEAK_BUT_TRY
    notes: Local staging general-purpose fallback.
  summarize_fast:
    model: llama3.2:3b
    task: summarize
    temperature: 0.1
    max_tokens: 640
    routing_label: LOCAL_OK
    notes: Local staging summarization fallback.
  embeddings:
    model: local-deterministic-hash
    task: embeddings
    temperature: 0.0
    max_tokens: 256
    routing_label: LOCAL_STAGING_DETERMINISTIC
    notes: Current memory-embed command uses deterministic local fallback embeddings for reproducible staging tests.

routing:
  task_map:
    chat: chat_default
    summarize: summarize_fast
    code: code_default
    review: code_default
    write_function: code_default
    write_tests: code_default
    search: summarize_fast
    log: summarize_fast
  escalation_rules:
    - task: large_refactor
      label: ESCALATE_TO_FRONTIER
      reason: Multi-file refactors with ambiguous requirements exceed the local baseline.
    - task: complex_architecture
      label: ESCALATE_TO_FRONTIER
      reason: Long-horizon reasoning should be routed to a stronger model.

home_mcp:
  base_dir: data/local_staging/home_mcp
  auth_mode: none
  allowed_roots:
    recipe_book:
      path: recipes
      writable: true
      kind: notes
      notes: Local staging recipe cards and cooking notes.
    household:
      path: household
      writable: true
      kind: notes
      notes: Local staging household notes.
    projects:
      path: projects
      writable: true
      kind: notes
      notes: Local staging project notes.
    inbox:
      path: inbox
      writable: true
      kind: notes
      notes: Local staging capture inbox.
    archive:
      path: archive
      writable: false
      kind: notes
      notes: Local staging read-only archive.

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative MiniLLM terminal flow</title>
  <desc id="desc">A synthetic terminal example showing governed retrieval, provenance, abstention, and a trace identifier.</desc>
  <rect width="1200" height="520" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="38" cy="34" r="8" fill="#ff7b72"/>
  <circle cx="66" cy="34" r="8" fill="#d29922"/>
  <circle cx="94" cy="34" r="8" fill="#3fb950"/>
  <text x="600" y="41" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">MiniLLM - synthetic local demonstration</text>
  <line x1="0" y1="62" x2="1200" y2="62" stroke="#30363d" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
    <text x="38" y="108" fill="#7ee787">$</text>
    <text x="68" y="108" fill="#c9d1d9">lagent memory-search "deployment decision" --explain</text>

    <text x="38" y="158" fill="#8b949e">status</text>
    <text x="230" y="158" fill="#7ee787">ok</text>
    <text x="38" y="198" fill="#8b949e">result</text>
    <text x="230" y="198" fill="#c9d1d9">reviewed decision with 3 provenance links</text>
    <text x="38" y="238" fill="#8b949e">evidence</text>
    <text x="230" y="238" fill="#79c0ff">user-authored</text>
    <text x="420" y="238" fill="#8b949e">confidence</text>
    <text x="570" y="238" fill="#d2a8ff">0.92</text>
    <text x="38" y="278" fill="#8b949e">governance</text>
    <text x="230" y="278" fill="#ffa657">cross-domain evidence blocked</text>
    <text x="38" y="318" fill="#8b949e">trace</text>
    <text x="230" y="318" fill="#c9d1d9">run_demo_7f31 - ranking, filters, disclosure</text>

    <text x="38" y="382" fill="#7ee787">$</text>
    <text x="68" y="382" fill="#c9d1d9">lagent memory-search "unrelated nonsense" --explain</text>
    <text x="38" y="432" fill="#8b949e">status</text>
    <text x="230" y="432" fill="#ffa657">no_reliable_results</text>
    <text x="38" y="472" fill="#8b949e">reason</text>
    <text x="230" y="472" fill="#c9d1d9">relevance floor rejected plausible-looking filler</text>
  </g>
</svg>

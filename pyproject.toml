[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minillm"
version = "0.1.0a1"
description = "Governed local memory, retrieval, and agent tooling with explicit provenance and failure handling"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "David Dalconzo" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0.1",
  "typer>=0.16.0",
]

[project.scripts]
lagent = "local_agent_lab.cli:app"
minillm-promote = "local_agent_lab.trusted_promotion_cli:app"

[dependency-groups]
dev = [
  "build>=1.3.0",
  "mypy>=1.18.0",
  "pip-audit>=2.9.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.14.0",
  "setuptools>=84.1.0",
  "types-PyYAML>=6.0.12",
  "wheel>=0.45.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/minillm/config" = ["config/agent.yaml"]
"share/minillm/config/prompts" = ["config/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
files = [
  "src/local_agent_lab/config.py",
  "src/local_agent_lab/evals/memory_v1.py",
  "src/local_agent_lab/indexing/repo_indexer.py",
  "src/local_agent_lab/indexing/visibility.py",
  "src/local_agent_lab/llm/model_router.py",
  "src/local_agent_lab/llm/ollama_client.py",
  "src/local_agent_lab/logging/run_logger.py",
  "src/local_agent_lab/security/paths.py",
  "src/local_agent_lab/tools/patches.py",
]

[tool.coverage.run]
branch = true
source = ["local_agent_lab"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 70

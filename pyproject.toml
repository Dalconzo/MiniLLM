[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-lab"
version = "0.1.0"
description = "SSH-first local coding and retrieval agent workflows for a Mac mini"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David Dalconzo" }]
dependencies = [
  "PyYAML>=6.0.1",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
lagent = "local_agent_lab.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
